name: Docs Preview (VitePress)

on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/build-*-docs.ts'
      - '.vitepress/**'
  pull_request:
    paths:
      - 'docs/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: yarn --ignore-scripts

      - name: Determine base path
        id: base
        run: |
          # Main branch deploys to root, other branches to /branch/<name>/
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g')
          if [ "$BRANCH" = "main" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "dir=main" >> "$GITHUB_OUTPUT"
          else
            echo "path=/branch/${SAFE_BRANCH}/" >> "$GITHUB_OUTPUT"
            echo "dir=branch/${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          fi
          echo "Branch: $BRANCH → base: $(cat "$GITHUB_OUTPUT" | grep path | cut -d= -f2)"

      - name: Set VitePress base path
        run: |
          BASE="${{ steps.base.outputs.path }}"
          if [ "$BASE" != "/" ]; then
            sed -i "s|cleanUrls: true,|cleanUrls: true,\n  base: '${BASE}',|" docs/.vitepress/config.mts
          fi

      - name: Build VitePress
        run: npx vitepress build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

      - name: Upload branch preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ steps.base.outputs.dir }}
          path: docs/.vitepress/dist

  deploy-main:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Download branch artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-${{ needs.build.outputs.dir || 'branch' }}
          path: /tmp/docs-branch

      - name: Determine branch dir
        id: base
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's|/|-|g')
          echo "dir=branch/${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Copy to gh-pages
        run: |
          DIR="${{ steps.base.outputs.dir }}"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cp -r /tmp/docs-branch/* "$DIR/"

      - name: Update branch index
        run: |
          # Generate index of all branch previews
          echo "# Branch Previews" > branch/index.md
          echo "" >> branch/index.md
          for d in branch/*/; do
            name=$(basename "$d")
            [ "$name" = "index.md" ] && continue
            echo "- [$name]($name/)" >> branch/index.md
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Deploy docs preview: ${{ steps.base.outputs.dir }}"
          git push
